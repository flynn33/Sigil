name: Sigil
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "17.0"
packages:
  ForsettiFramework:
    url: https://github.com/flynn33/Forsetti-Framework-Mac-iOS.git
    revision: 43eef7a739f3b78253c64aa4b070521ab5b1f43c
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: "com.ravenforge.sigil.$(PRODUCT_NAME:rfc1034identifier)"
    MARKETING_VERSION: "PA.0.6.0"
    CURRENT_PROJECT_VERSION: "7"
targets:
  RFSigilCoreModels:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilCoreModels
  RFSigilSourceAuthority:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilSourceAuthority
    dependencies:
      - target: RFSigilCoreModels
      - package: ForsettiFramework
        product: ForsettiCore
  RFSigilAPSIntegration:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilAPSIntegration
    dependencies:
      - target: RFSigilCoreModels
      - package: ForsettiFramework
        product: ForsettiCore
  RFSigilAeostaraIntegration:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilAeostaraIntegration
    dependencies:
      - target: RFSigilCoreModels
      - package: ForsettiFramework
        product: ForsettiCore
  RFSigilVisibleGlyph:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilVisibleGlyph
    dependencies:
      - target: RFSigilCoreModels
      - target: RFSigilDiagnostics
      - package: ForsettiFramework
        product: ForsettiCore
  RFSigilPipelinePlaceholder:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilPipelinePlaceholder
    dependencies:
      - target: RFSigilCoreModels
      - package: ForsettiFramework
        product: ForsettiCore
  RFSigilPrivacySecurity:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilPrivacySecurity
    dependencies:
      - target: RFSigilCoreModels
      - package: ForsettiFramework
        product: ForsettiCore
  RFSigilDiagnostics:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilDiagnostics
    dependencies:
      - target: RFSigilCoreModels
      - package: ForsettiFramework
        product: ForsettiCore
  RFSigilCanon:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilCanon
  RFSigilPersonalCodex:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilPersonalCodex
    dependencies:
      - target: RFSigilCoreModels
      - target: RFSigilCanon
      - target: RFSigilVisibleGlyph
      - target: RFSigilDiagnostics
      - target: RFSigilPrivacySecurity
  RFSigilUIModule:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilUIModule
    dependencies:
      - target: RFSigilCoreModels
      - package: ForsettiFramework
        product: ForsettiCore
  RFSigilForsettiModules:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilForsettiModules
    dependencies:
      - target: RFSigilCoreModels
      - target: RFSigilSourceAuthority
      - target: RFSigilAPSIntegration
      - target: RFSigilAeostaraIntegration
      - target: RFSigilVisibleGlyph
      - target: RFSigilPipelinePlaceholder
      - target: RFSigilPrivacySecurity
      - target: RFSigilDiagnostics
      - target: RFSigilUIModule
      - package: ForsettiFramework
        product: ForsettiCore
  RFSigilRuntime:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Sources/RFSigilRuntime
    dependencies:
      - target: RFSigilCoreModels
      - target: RFSigilSourceAuthority
      - target: RFSigilAPSIntegration
      - target: RFSigilAeostaraIntegration
      - target: RFSigilVisibleGlyph
      - target: RFSigilPipelinePlaceholder
      - target: RFSigilPrivacySecurity
      - target: RFSigilDiagnostics
      - target: RFSigilCanon
      - target: RFSigilPersonalCodex
      - target: RFSigilForsettiModules
      - package: ForsettiFramework
        product: ForsettiCore
  SigilApp:
    type: application
    platform: iOS
    sources:
      - Sources/SigilApp
    info:
      path: Sources/SigilApp/Info.plist
      properties:
        CFBundleDisplayName: Sigil
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ravenforge.sigil
    dependencies:
      - target: RFSigilRuntime
      - target: RFSigilUIModule
  SigilTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - Tests/SigilTests
    dependencies:
      - target: RFSigilCoreModels
      - target: RFSigilSourceAuthority
      - target: RFSigilAPSIntegration
      - target: RFSigilAeostaraIntegration
      - target: RFSigilVisibleGlyph
      - target: RFSigilPipelinePlaceholder
      - target: RFSigilPrivacySecurity
      - target: RFSigilDiagnostics
      - target: RFSigilCanon
      - target: RFSigilPersonalCodex
      - target: RFSigilForsettiModules
      - target: RFSigilRuntime
      - target: SigilApp
      - package: ForsettiFramework
        product: ForsettiCore
schemes:
  SigilApp:
    build:
      targets:
        SigilApp: all
        SigilTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SigilTests
