name: Version Guard

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version-guard:
    name: Version Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect version inputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only -z "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/changed-paths"
            git show "${{ github.event.pull_request.base.sha }}:VERSION" > "$RUNNER_TEMP/base-version" 2>/dev/null || true
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git ls-files -z > "$RUNNER_TEMP/changed-paths"
            printf '' > "$RUNNER_TEMP/base-version"
          else
            git diff --name-only -z "${{ github.event.before }}..${{ github.sha }}" > "$RUNNER_TEMP/changed-paths"
            git show "${{ github.event.before }}:VERSION" > "$RUNNER_TEMP/base-version" 2>/dev/null || true
          fi

      - name: Run version guard
        shell: bash
        run: |
          python3 scripts/version_guard.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --changed-paths-from "$RUNNER_TEMP/changed-paths" \
            --base-version-file "$RUNNER_TEMP/base-version"
